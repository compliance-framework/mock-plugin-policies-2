name: preview

on:
  push:
    branches: [main]
  pull_request:
    # labeled: publish pr-<number> when the `preview` label is added.
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    uses: compliance-framework/workflows/.github/workflows/preview.yml@main
    with:
      kind: policies
      on-main: false
    permissions:
      contents: read
      packages: write
