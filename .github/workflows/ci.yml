name: ci

on:
  pull_request:
    # edited: re-check the PR title (ci-common.yml's pr-title job) when it changes.
    # labeled, unlabeled: re-run release-checks (version-guard reads the PR's labels).
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions: {}

jobs:
  ci:
    uses: compliance-framework/workflows/.github/workflows/ci-policies.yml@d72b127a668e93d3eb503f775fb4c2bbb0bfdef9 # v1.2.0
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    secrets: inherit

  release-checks:
    # Runs only on release-please-- PR branches; skipped (counts as passing) elsewhere.
    uses: compliance-framework/workflows/.github/workflows/release-checks.yml@d72b127a668e93d3eb503f775fb4c2bbb0bfdef9 # v1.2.0
    permissions:
      contents: read

  notify:
    needs: [ci, release-checks]
    if: always()
    uses: compliance-framework/workflows/.github/workflows/notify-failure.yml@d72b127a668e93d3eb503f775fb4c2bbb0bfdef9 # v1.2.0
    with:
      needs: ${{ toJSON(needs) }}
    permissions:
      contents: read
    secrets: inherit
